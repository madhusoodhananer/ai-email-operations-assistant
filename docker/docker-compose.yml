# PostgreSQL for local development.
#
# Run from the repository root so that .env is picked up for substitution:
#
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#
# See docker/README.md for the full command set.

name: email-operations

services:
  postgres:
    # Pinned deliberately. A floating tag would silently change the engine
    # version underneath an existing data volume.
    image: postgres:16.4-alpine
    container_name: email-operations-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_operations}
      POSTGRES_USER: ${POSTGRES_USER:-email_operations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation, so index ordering does not depend on the host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    # Bound to loopback only. Exposing 5432 on all interfaces would put the
    # database on the local network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed once, in filename order, on first initialization only.
      # An existing volume is never re-initialized.
      - ../database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-email_operations} -d ${POSTGRES_DB:-email_operations}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Services added later declare:
    #   depends_on:
    #     postgres:
    #       condition: service_healthy
    # so they do not start against a database that is not yet accepting
    # connections.

volumes:
  pgdata:
    name: email-operations-pgdata
